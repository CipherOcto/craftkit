[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# The SDK is the only thing a plugin depends on.
craftkit-sdk = { path = "crates/craftkit-sdk", version = "0.2.0" }
craftkit-derive = { path = "crates/craftkit-derive", version = "0.2.0" }
# The geometry: a **library**, not a plugin. It contributes nothing to the
# registry and the linker does not wire it in.
craftkit-vector-geom = { path = "crates/craftkit-vector-geom", version = "0.2.0" }
# The time model of the sound battery — and of the CLAP battery, whose
# transport is worked out with it: a **library**, not a plugin. It
# contributes nothing to the registry and the linker does not wire it
# in.
craftkit-sound-time = { path = "crates/craftkit-sound-time", version = "0.2.0" }
# The **payload reader**: a bounded reader for the values a document
# carries. A **library**, not a plugin — the core bounds a command's
# parameters and says nothing about a payload, so the reading of one is
# a plugin's business and the mechanism is shared.
craftkit-payload = { path = "crates/craftkit-payload", version = "0.2.0" }
# The line breaker: the box/glue/penalty model, and the two breakers. A
# **library**, not a plugin. It contributes nothing to the registry and
# the linker does not wire it in.
craftkit-text-layout = { path = "crates/craftkit-text-layout", version = "0.2.0" }
# The kit's own typeface: glyphs as strokes, drawn in code. A
# **library**, not a plugin. It contributes nothing to the registry and
# the linker does not wire it in.
craftkit-font = { path = "crates/craftkit-font", version = "0.2.0" }
# The **WAV reader**: the samples of a sound, from the file. A
# **library**, not a plugin: it contributes nothing to the registry and
# the linker does not wire it in.
craftkit-wav = { path = "crates/craftkit-wav", version = "0.2.0" }
# The MCP door: the registry, spoken to an agent. One tool per command.
craftkit-mcp = { path = "crates/craftkit-mcp", version = "0.2.0" }
# The **PNG reader**: the pixels of a picture, and the inflate they come
# in. A **library**, not a plugin: it contributes nothing to the registry
# and the linker does not wire it in.
craftkit-png = { path = "crates/craftkit-png", version = "0.2.0" }
# The **JPEG decoder**: the family's own, clean-room from ITU-T T.81. A
# **library**, not a plugin: it contributes nothing to the registry and
# the linker does not wire it in.
craftkit-jpeg = { path = "crates/craftkit-jpeg", version = "0.2.0" }
# The **picture's size**: read from a picture's header. A **library**,
# not a plugin: it contributes nothing to the registry and the linker
# does not wire it in.
craftkit-image = { path = "crates/craftkit-image", version = "0.2.0" }
# The **image battery**: a picture is a size and a file. It is optional,
# like the others.
craftkit-plugin-image = { path = "crates/craftkit-plugin-image", version = "0.2.0" }
# The **rasteriser**: a canvas that draws a document into a picture. A
# **library**, not a plugin: it contributes nothing to the registry and
# the linker does not wire it in.
craftkit-control = { path = "crates/craftkit-control", version = "0.2.0" }
# The **VST3 ABI**: the shapes a VST3 plugin is made of. A crate of
# data, with no `unsafe` in it at all.
craftkit-vst3-abi = { path = "crates/craftkit-vst3-abi", version = "0.2.0" }
# The **AU ABI**: the shapes an Audio Unit is made of. A crate of data,
# with no `unsafe` in it at all.
craftkit-au-abi = { path = "crates/craftkit-au-abi", version = "0.2.0" }
# The **AU host**: the door that opens a unit and drives it. A
# **library**, not a plugin: it contributes nothing to the registry and
# the linker does not wire it in.
craftkit-au = { path = "crates/craftkit-au", version = "0.2.0" }
# A **reference AU**: a shared library that exports the symbols the host
# looks for. It is a fixture, and it is here because a host that has
# never opened a real unit has not been tested.
craftkit-au-fixture = { path = "crates/craftkit-au-fixture", version = "0.2.0" }
# The **VST3 host**: the door that opens a VST3 plugin and drives the
# component inside it. A **library**, not a plugin: it contributes
# nothing to the registry and the linker does not wire it in.
craftkit-vst3 = { path = "crates/craftkit-vst3", version = "0.2.0" }
# The **VST3 battery**: the document model of a VST3 plugin — an
# identity, a parameter list and a state. A plugin, and not a library.
craftkit-plugin-vst3 = { path = "crates/craftkit-plugin-vst3", version = "0.2.0" }
# A **reference VST3 plugin**: a shared library that exports the entry
# the host looks for. It is a fixture, and it is here because a host
# that has never opened a real plugin has not been tested.
craftkit-vst3-fixture = { path = "crates/craftkit-vst3-fixture", version = "0.2.0" }
craftkit-raster = { path = "crates/craftkit-raster", version = "0.2.0" }
# The **terminal door**: a person drives the kit from a prompt. It is an
# **application**, and it depends on everything.
craftkit-repl = { path = "apps/craftkit-repl", version = "0.2.0" }
# The **typed value**: a length in millimetres and an angle in radians. A
# **library**, not a plugin. It contributes nothing to the registry and
# the linker does not wire it in.
craftkit-numeric = { path = "crates/craftkit-numeric", version = "0.2.0" }
# The **door**: opening a shared library and calling the plugin table in
# it. A crate with the second of v2's three allowed exceptions.
craftkit-ffi = { path = "crates/craftkit-ffi", version = "0.2.0" }
# The **contract** the door and the plugin agree on. No dependencies.
craftkit-ffi-abi = { path = "crates/craftkit-ffi-abi", version = "0.2.0" }
# The **CLAP ABI**: the shapes a CLAP plugin is made of. No dependencies:
# a binary contract is a set of shapes, and a set of shapes is data.
craftkit-clap-abi = { path = "crates/craftkit-clap-abi", version = "0.2.0" }
# The **CLAP host**: the door that opens a CLAP plugin and asks it what
# it holds. A **library**, not a plugin: it contributes nothing to the
# registry and the linker does not wire it in.
craftkit-clap = { path = "crates/craftkit-clap", version = "0.2.0" }

serde_json = "1"
inventory = "0.3"

# The **toolkit** the window is drawn with, and the window itself. They
# are **libraries**, not plugins: they contribute no command and no
# kind, and the linker does not wire them in.
egui = "0.33"
eframe = { version = "0.33", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }

# The geometry the batteries' path operations use. Both are permissively
# licensed and both are dependencies, not copied code: `kurbo` is the bezier
# library and `linesweeper` is a robust sweep-line boolean operation.
kurbo = "0.13"
linesweeper = "0.5"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3"
