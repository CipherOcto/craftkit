[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# The SDK is the only thing a plugin depends on.
craftkit-sdk = { path = "crates/craftkit-sdk", version = "0.2.0" }
craftkit-derive = { path = "crates/craftkit-derive", version = "0.2.0" }

serde_json = "1"
inventory = "0.3"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3"
