[package]
name = "craftkit-clap"
description = "The CLAP host: open a CLAP plugin, read its entry, and ask it what it holds."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The shapes of the format, and nothing else.
craftkit-clap-abi = { workspace = true }

[dev-dependencies]
# A CLAP plugin that is **not part of the program**: a shared library,
# built by cargo and opened by the tests. It is a dev dependency, so
# nothing that ships links it.
craftkit-clap-fixture = { path = "../craftkit-clap-fixture" }
