[package]
name = "craftkit-text-layout"
description = "Line breaking on the box/glue/penalty model: the optimal breaker and the greedy one. A library, not a plugin."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Nothing. The model is arithmetic over plain numbers, and it knows
# nothing about a document, a font or the kit: a caller brings the
# widths, and the library brings the breaks.
