[package]
name = "craftkit-plugin-text"
description = "A plugin that lays a paragraph out into lines: the text battery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The SDK and the macro. And a **library**: the line breaking is not the
# plugin's, and the linker does not wire a library in.
craftkit-sdk = { workspace = true }
craftkit-derive = { workspace = true }
craftkit-text-layout = { path = "../craftkit-text-layout", version = "0.2.0" }
# The **hyphenation**: where a word may be broken. A **library**, not a
# plugin: it contributes nothing to the registry and the linker does
# not wire it in.
craftkit-hyphen = { path = "../craftkit-hyphen", version = "0.2.0" }
# The kit's own typeface: the letters the paragraph is drawn with.
craftkit-font = { path = "../craftkit-font", version = "0.2.0" }
# The **payload reader**: a bounded reading of the values a node
# carries. The plugin's own bounds, and the mechanism that holds them.
craftkit-payload = { path = "../craftkit-payload", version = "0.2.0" }
