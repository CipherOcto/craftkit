[package]
name = "craftkit-plugin-shared"
description = "A plugin that is not part of the program: a shared library with an entry point, found by name."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# A **shared library**, and an rlib as well: the rlib is what the
# loader's tests link against, so that the shared library is built
# before the tests run.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The contract, and nothing else.
craftkit-ffi-abi = { path = "../craftkit-ffi-abi" }

[dev-dependencies]
# A plugin that is **not part of the program**: a shared library, built
# by cargo and opened by the tests. It is a dev dependency, so nothing
# that ships links it.
craftkit-plugin-shared = { path = "../craftkit-plugin-shared" }
