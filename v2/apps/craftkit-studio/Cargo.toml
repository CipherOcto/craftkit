[package]
name = "craftkit-studio"
description = "An application that knows its commands because they were linked in."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
craftkit-sdk = { workspace = true }
craftkit-derive = { workspace = true }
# A plugin. The application lists it because a plugin has to be *linked in*,
# and for no other reason: no module of this crate names a symbol of it, and
# a test says so.
craftkit-plugin-hello = { path = "../../crates/craftkit-plugin-hello" }
# A second plugin, and it is the interesting one: it adds a layer, a kind of
# node, a tool and a command.
craftkit-plugin-shapes = { path = "../../crates/craftkit-plugin-shapes" }
# The **battery**: an optional plugin. With the `vector` feature on, it is
# linked in and its commands are in the ecosystem; with it off, the crate is
# not there at all and the program does not know it exists.
craftkit-plugin-vector = { path = "../../crates/craftkit-plugin-vector", optional = true }
# The **second battery**: the sound document. Off by default as well: a
# program that wants a tempo map says so.
craftkit-plugin-sound = { path = "../../crates/craftkit-plugin-sound", optional = true }
# The **third battery**: the object model of a PDF document. Off by default
# as well: a program that wants dictionaries and references says so.
craftkit-plugin-pdf = { path = "../../crates/craftkit-plugin-pdf", optional = true }
# The **fourth battery**: the document model of a video editor. Off by
# default as well: a program that wants bins, tracks and clips says so.
craftkit-plugin-film = { path = "../../crates/craftkit-plugin-film", optional = true }
# The **fifth battery**: the document model of a compositing application.
# Off by default as well: a program that wants comps and properties says
# so.
craftkit-plugin-fx = { path = "../../crates/craftkit-plugin-fx", optional = true }
# The **sixth battery**: the document model of an artist's IDE — projects,
# scenes, tracks, elements, an opaque 3D stage and remote generations. Off
# by default as well: a program that wants a timeline of media tokens says
# so.
craftkit-plugin-art = { path = "../../crates/craftkit-plugin-art", optional = true }

[features]
default = []
# The vector battery. Off by default: a program that wants paths says so.
vector = ["dep:craftkit-plugin-vector"]
# The sound battery. Off by default: a program that wants tracks and a
# tempo map says so.
sound = ["dep:craftkit-plugin-sound"]
# The PDF battery. Off by default: a program that wants the object model
# of a PDF document says so.
pdf = ["dep:craftkit-plugin-pdf"]
# The film battery. Off by default: a program that wants bins, tracks and
# clips says so.
film = ["dep:craftkit-plugin-film"]
# The compositing battery. Off by default: a program that wants comps and
# property trees says so.
fx = ["dep:craftkit-plugin-fx"]
# The artist's battery. Off by default: a program that wants a timeline of
# media tokens and remote generations says so.
art = ["dep:craftkit-plugin-art"]

[dev-dependencies]
# The counting allocator: the one piece of unsafe in v2, and what makes
# the lane's "must not allocate" rule a measurement rather than a claim.
# It is a **dev** dependency: nothing in the application links it, and
# the application itself still forbids unsafe.
craftkit-alloc = { path = "../../crates/craftkit-alloc" }
# A plugin that is **not part of the program**: a shared library, built
# by cargo and opened by the door's tests. It is a dev dependency, so
# nothing that ships links it.
craftkit-plugin-shared = { path = "../../crates/craftkit-plugin-shared" }

[build-dependencies]
# The wiring: the dependency list is the plugin list. It is a build
# dependency, so it is compiled for the build script and is not in the
# application's own dependency list.
craftkit-link = { path = "../../crates/craftkit-link" }
