[package]
name = "craftkit-studio"
description = "An application that knows its commands because they were linked in."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
craftkit-sdk = { workspace = true }
craftkit-derive = { workspace = true }
# A plugin. The application lists it because a plugin has to be *linked in*,
# and for no other reason: no module of this crate names a symbol of it, and
# a test says so.
craftkit-plugin-hello = { path = "../../crates/craftkit-plugin-hello" }
# A second plugin, and it is the interesting one: it adds a layer, a kind of
# node, a tool and a command.
craftkit-plugin-shapes = { path = "../../crates/craftkit-plugin-shapes" }

[build-dependencies]
# The wiring: the dependency list is the plugin list. It is a build
# dependency, so it is compiled for the build script and is not in the
# application's own dependency list.
craftkit-link = { path = "../../crates/craftkit-link" }
