[package]
name = "craftkit-window"
description = "A window over the kit: the registry, the document, and the plan."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
craftkit-sdk = { workspace = true }
# The **application's ecosystem**: every battery the window links in is
# in it, and the window names none of them. All of them are linked in:
# a window that showed half the kit would be a window with a hole in it.
craftkit-studio = { path = "../craftkit-studio", features = [
    "vector",
    "sound",
    "pdf",
    "film",
    "fx",
    "art",
    "grid",
    "cad",
    "prose",
    "layout",
    "numeric",
    "text",
    "image",
    "clap",
] }
# The **control channel**: the door an agent drives the window through.
# It serves the window's own session, so a command that an agent runs
# changes the document the window is drawing.
craftkit-control = { workspace = true }
# The **rasteriser**: the canvas that draws a document into a picture.
# It is a **library** and not a plugin: it contributes no command and
# no kind.
craftkit-raster = { workspace = true }
# The **toolkit** the window is drawn with, and the window itself. The
# toolkit is a **library** and not a plugin: it contributes no command
# and no kind.
egui = { workspace = true }
eframe = { workspace = true }
