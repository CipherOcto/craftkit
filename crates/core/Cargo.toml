[package]
name = "craftkit-core"
description = "craftkit foundation: exact time, typed values, identifiers, and the hostile-input readers. Publishable, no workspace dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
