[package]
name = "craftkit-au"
description = "The AU host: open a unit, make an instance, and drive it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The shapes of the format, and nothing else.
craftkit-au-abi = { workspace = true }

[dev-dependencies]
# An AU that is **not part of the program**: a shared library, built by
# cargo and opened by the tests. It is a dev dependency, so nothing that
# ships links it.
craftkit-au-fixture = { path = "../craftkit-au-fixture" }
