[package]
name = "craftkit-eval"
description = "Evaluation: turn a document plus an instant into a plan, reusing unchanged prefixes."
# Not published: the tree has no release process, and the family shares
# this code by copying it, not by depending on it. Publishing a 0.1.0
# would promise a stability the tree does not have.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
craftkit-core = { workspace = true }
craftkit-model = { workspace = true }
craftkit-kernel = { workspace = true }
