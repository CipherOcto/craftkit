[package]
name = "craftkit-ui"
description = "The front end: a thin shell over the engine, with agent-addressable widgets."
# Not published: the tree has no release process, and the family shares
# this code by copying it, not by depending on it. Publishing a 0.1.0
# would promise a stability the tree does not have.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
craftkit-foundation = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
egui = { workspace = true }
image = { workspace = true }
craftkit-core = { workspace = true }
craftkit-model = { workspace = true }
craftkit-engine = { workspace = true }
craftkit-eval = { workspace = true }