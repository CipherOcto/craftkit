[package]
name = "craftkit-plugin-film"
description = "A plugin that adds the document model of a video editor: bins, items, tracks and clips."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The SDK and the macro. **Nothing else** — the application never names a
# symbol of this crate, and this crate never names a symbol of the
# application.
craftkit-sdk = { workspace = true }
craftkit-derive = { workspace = true }
# The kit's own typeface: the letters of a caption are measured with it.
craftkit-font = { path = "../craftkit-font", version = "0.2.0" }
# The **picture**: the frame of a caption is one, and it is written as a PNG.
craftkit-raster = { path = "../craftkit-raster", version = "0.2.0" }

[dev-dependencies]
# The **scratch**: the file a test writes, taken back when the test's
# thread ends. A dev dependency: nothing that ships links it.
craftkit-scratch = { path = "../craftkit-scratch", version = "0.2.0" }
# The **picture**: the test reads the PNG that the burn-in writes.
craftkit-png = { path = "../craftkit-png", version = "0.2.0" }
