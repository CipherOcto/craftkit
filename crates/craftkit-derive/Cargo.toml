[package]
name = "craftkit-derive"
description = "Write a command's declaration, its reader and its registration."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }
proc-macro-crate = { workspace = true }

# The **registry** is the only way to see what a declaration produced, and
# the registry lives in the SDK. So the SDK is a **dev** dependency: a test
# that reads the registry needs it, and a dev dependency does not ship —
# which is why the layering rules do not apply to it.
[dev-dependencies]
craftkit-sdk = { workspace = true }
