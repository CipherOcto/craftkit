[package]
name = "craftkit-sdk"
description = "The whole surface a plugin needs: parameters, commands, the registry and the session."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde_json = { workspace = true }
# The macro the SDK uses for its own format types: the document's shape and
# the step between two versions of it are written by the compiler.
craftkit-derive = { workspace = true }
# The link-time registry. The derive macro writes the registration and the
# SDK re-exports `inventory`, so a plugin's dependency list is the SDK and
# the macro — and nothing else.
inventory = { workspace = true }
# The **door**: opening a shared library and calling the plugin table in
# it. The SDK holds the libraries a session has open, so this is where
# that comes from. The door's own `unsafe` is in that crate and nowhere
# else.
craftkit-ffi = { workspace = true }
