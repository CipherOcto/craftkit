[package]
name = "craftkit-engine"
description = "The command registry, the session, undo, and the crash reporter."
# Not published: the tree has no release process, and the family shares
# this code by copying it, not by depending on it. Publishing a 0.1.0
# would promise a stability the tree does not have.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
craftkit-foundation = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
craftkit-core = { workspace = true }
craftkit-model = { workspace = true }
craftkit-eval = { workspace = true }
craftkit-kernel = { workspace = true }
# The commands that write a file write it through the tree's one writer.
# `craftkit-io` is L3 and this crate is L4, so the dependency points the
# right way. §288.
craftkit-io = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }
# The properties read the tree's own bounds, so that the values they fire are
# the tree's rules rather than guesses. §188.
craftkit-core = { workspace = true }
craftkit-model = { workspace = true }
