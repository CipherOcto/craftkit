[package]
name = "craftkit-numeric"
description = "The typed value: a length in millimetres and an angle in radians. A library, not a plugin."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The SDK, and nothing else. The typed value is plain arithmetic over
# `std` types, and the SDK is the kit itself: the library implements the
# kit's `ParamKind`, so that a **length** can be a command's parameter
# and not only a number that means millimetres by accident.
craftkit-sdk = { workspace = true }
