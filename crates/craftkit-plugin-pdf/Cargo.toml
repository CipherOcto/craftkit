[package]
name = "craftkit-plugin-pdf"
description = "A plugin that adds the object model of a PDF document: dictionaries, streams and references."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The SDK and the macro. **Nothing else** — the application never names a
# symbol of this crate, and this crate never names a symbol of the
# application. That is the whole point of a plugin.
craftkit-sdk = { workspace = true }
craftkit-derive = { workspace = true }
# The **inflate**: a Flate stream is a zlib stream, and the PNG crate's
# inflate is the one the kit has. It is a **library**, and the linker
# does not wire it in.
craftkit-png = { path = "../craftkit-png", version = "0.2.0" }

[dev-dependencies]
# The **scratch**: the file or the directory a test works in, taken
# back when the thread that asked for it ends. A **dev** dependency:
# nothing that ships links it.
craftkit-scratch = { path = "../craftkit-scratch", version = "0.2.0" }
