[package]
name = "craftkit-io"
description = "The .craftkit file format: versioned, validated, and steppable."
# Not published: the tree has no release process, and the family shares
# this code by copying it, not by depending on it. Publishing a 0.1.0
# would promise a stability the tree does not have.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
craftkit-foundation = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
craftkit-core = { workspace = true }
craftkit-model = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }
craftkit-model = { workspace = true }
