[package]
name = "craftkit-android"
description = "The craftkit Android package: the entry point the platform looks up by name."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# The platform's own keyboard, behind a gate. §257.
#
# The gate is off by default: the tree's default package carries no Java and
# no dex (§236). Turning it on carries the Java files, a dex, and the bridge
# the platform's keyboard talks to.
[features]
platform-ime = ["craftkit/platform-ime", "dep:jni"]

# The Android package is a shared library and nothing else: Android's loader
# opens it and looks up one symbol in it by name. §236.
[lib]
name = "craftkit_android"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# The JNI, for the one native method the platform's Java calls. §257.
#
# It is **optional** and it is only here behind the gate: the tree's default
# build has no Java to call it, and the version is the one `android-activity`
# already uses, so there is one `jni` in the build and not two.
jni = { workspace = true, optional = true }
# The application itself — the window, the session and the shell are the same
# code the desktop application runs.
craftkit = { workspace = true }
# The handle the platform hands the application, and the feature that turns on
# the platform's event loop and the glue crate that carries the activity's
# events. The version is the one `egui-winit` already uses, so there is one
# `winit` in the build and not two.
winit = { workspace = true, features = ["android-native-activity"] }
# The same feature, on the frame: it is what tells `eframe` to build the event
# loop from the activity's handle.
eframe = { workspace = true, features = ["android-native-activity"] }

# How `cargo apk` packages the application. The activity is the platform's own
# `NativeActivity`, so the APK carries no Java at all. §236.
[package.metadata.android]
package = "org.craftocto.craftkit"
build_targets = ["armv7-linux-androideabi", "aarch64-linux-android"]
min_sdk_version = 21
target_sdk_version = 30
