[package]
name = "craftkit-web"
description = "craftkit in a browser. The same engine, the same commands, wasm32."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "craftkit-web"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
eframe = { workspace = true }
craftkit-core = { workspace = true }
craftkit-engine = { workspace = true }
craftkit-io = { workspace = true }
craftkit-ui = { workspace = true }

# Only the browser build needs these. They stay out of the native graph so a
# host build of this crate pulls in no wasm machinery at all, and so
# `cargo test -p craftkit-web` runs the pure logic on the host with no browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true }
