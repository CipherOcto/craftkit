# The v2 tree's own continuous integration.
#
# v2 is **excluded from the outer workspace**: it is a spike, it has its own
# rules, and it has its own gates. So it gets its own workflow rather than a
# phase in the outer one, and the outer tree learns nothing about it.
#
# The job is **skipped when there is no v2/** — which is the case on `main`,
# where the tree is the owner's own. A gate that cannot run says so; a job
# that runs on a tree that is not there is a red cross for nothing.
#
# What it runs is the v2 tree's own house: the formatter, the linter, the
# tests, the browser door's module, and the outer gate that reads v2's files.

name: v2

on:
  push:
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref: nobody is waiting for
# a result they no longer care about.
concurrency:
  group: v2-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # `--locked` everywhere. A build that quietly updates the lock file is a build
  # nobody has tested.
  RUSTFLAGS: -D warnings

jobs:
  gates:
    name: the v2 gates
    runs-on: ubuntu-latest
    # The tree is not here on `main`, and a job that cannot run must not
    # pretend to have run.
    if: hashFiles('v2/Cargo.toml') != ''
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4

      # The toolchain, with the browser's target: the browser door is a
      # WebAssembly module, and a module that does not build is not a door.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: v2

      # The house, in the order the house runs it: the formatter, the linter,
      # the tests.
      - name: The gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked

      # The browser door's module, built for the browser.
      - name: The browser door builds
        run: cargo build -p craftkit-wasm --target wasm32-unknown-unknown --release --locked

      # The outer tree's gate that reads v2's files: the public bounds v2
      # names, the deny attributes, the layering. It is the owner's gate and
      # it runs here because it reads this tree.
      - name: The outer gate that reads v2
        working-directory: .
        run: cargo run -q -p xtask -- lists
