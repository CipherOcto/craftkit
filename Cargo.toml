[workspace]
resolver = "3"
# Sorted: `cargo xtask lists` checks it, because this list is edited by almost
# every change that adds a crate.
members = [
    "apps/*",
    "crates/*",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The lowest toolchain this workspace is actually verified against: `stable` as
# of the first full green `cargo xtask ci`, with every test passing. Not a guess
# and not a wish — `cargo xtask doctor` compares it against the toolchain you
# are actually using and tells you when they disagree.
rust-version = "1.93"
license = "MIT OR Apache-2.0"
# Where the code actually is. It used to name `storytold/craftkit`, a
# repository that does not exist: the GitHub API answers 404 for it, and
# the tree's own remote is `CipherOcto/craftkit`. A package's `repository`
# field is where a reader is sent, so it has to be a place that answers.
# Measured 2026-10-28.
repository = "https://github.com/CipherOcto/craftkit"
authors = ["craftkit contributors"]

[workspace.dependencies]
# --- internal -------------------------------------------------------------
craftkit-foundation = { path = "crates/foundation", version = "0.1.0" }
craftkit-core = { path = "crates/core", version = "0.1.0" }
craftkit-model = { path = "crates/model", version = "0.1.0" }
craftkit-eval = { path = "crates/eval", version = "0.1.0" }
craftkit-kernel = { path = "crates/kernel", version = "0.1.0" }
craftkit-io = { path = "crates/io", version = "0.1.0" }
craftkit-engine = { path = "crates/engine", version = "0.1.0" }
craftkit-control = { path = "crates/control", version = "0.1.0" }
craftkit-mcp = { path = "crates/mcp", version = "0.1.0" }
craftkit-ui = { path = "crates/ui", version = "0.1.0" }
# The application itself. The Android package is the second entry point, and
# it needs the window, the session and the shell - the same code the desktop
# binary runs. §236.
craftkit = { path = "apps/craftkit", version = "0.1.0" }

# --- external -------------------------------------------------------------
# The JNI, for the one native method the platform's Java calls. §257.
#
# The version is the one `android-activity` already uses, so there is one
# `jni` in the build and not two.
jni = "0.22.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
egui = "0.33"
eframe = { version = "0.33", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
# The window's own toolkit, and the platform's activity handle on Android.
# Only the phone's entry point names it. §236.
winit = { version = "0.30", default-features = false }

# Property tests. A **dev-dependency** only: it is never linked into a
# shipped binary, so it is in the test build and not in the product. The
# family uses proptest and nothing else. §175.
proptest = "1"

# Browser only. See apps/craftkit-web/Cargo.toml, where they are target-gated.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Storage",
    "Window",
] }

[workspace.lints.rust]
# **Deny**, not forbid: a crate that exports a symbol the platform looks up
# **by name** cannot avoid an unsafe attribute (`#[unsafe(no_mangle)]`), and
# `forbid` cannot be relaxed by an `allow`. Every crate root carries
# `#![forbid(unsafe_code)]` — the house rule, checked by `cargo xtask lists` —
# so this is the backstop and not the rule. The one crate that may not forbid
# is the Android package, and it is named in the gate. §236.
unsafe_code = "deny"

# The house deny. Every production crate root repeats this with
# `#![deny(clippy::unwrap_used, ...)]`; `clippy.toml` relaxes it for tests.
# Kept here so a new crate that forgets the attribute still gets it.
[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev]
opt-level = 1

# The `ci` profile exists so the test suite is fast without going to full
# release, and with debug assertions off (they are slow and, in a graphics
# context, sometimes wrong) but overflow checks on.
# The lesson here is learned from the SolidCraft family.
[profile.ci]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"
debug-assertions = false
overflow-checks = true
incremental = true