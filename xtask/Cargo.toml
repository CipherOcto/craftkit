[package]
name = "xtask"
description = "The build tool: layering, assets, wasm and the ci gate."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
# The layering is checked when the tool is **built**, so that a layering
# mistake fails at build time and not only when the gate runs. The script
# reads the tree as text — it cannot depend on the tree's own crates, and
# it does not run `cargo metadata`.
build = "build.rs"

[lints]
workspace = true

[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# **Nothing of the tree's own.** The xtask is the tool that checks the tree,
# and a checker that cannot be built when the tree does not compile is a
# checker that is silent exactly when it is needed: the `lists` gate reads
# the tree as text precisely so it can say something about a broken tree.
# The fuzzer's corpus comes from the tree's *program* instead — see
# `xtask/src/fuzz.rs` and §180.
